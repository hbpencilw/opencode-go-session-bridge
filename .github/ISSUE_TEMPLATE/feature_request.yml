name: 功能建议
description: 提出新功能或改进想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 目前什么场景让你不顺手？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 理想中的行为；有参考实现更好
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
